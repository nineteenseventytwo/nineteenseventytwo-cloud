---
# Actions get pinned to commit SHAs (see the note in _terraform.yml). A pinned
# SHA is only safe if something tells you when it is stale, which is what this
# is for — Dependabot rewrites the SHA and puts the new tag in the comment.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown: {default-days: 14}
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - "/bootstrap/aws/accounts"
      - "/bootstrap/aws/foundation"
      - "/live/aws/org-management"
      - "/live/aws/security"
      - "/live/aws/shared"
      - "/live/aws/platform-prod"
      - "/live/aws/sandbox"
      - "/modules/aws-account-baseline"
      - "/modules/aws-account-ci"
      - "/modules/aws-cluster-oidc-role"
      - "/modules/aws-github-oidc-provider"
      - "/modules/aws-github-oidc-role"
      - "/modules/aws-org-policy"
      - "/modules/aws-tf-backend"
    schedule:
      interval: monthly
    # The two-week rule, enforced here rather than by remembering it: the
    # first run that worked (2026-11-14, after #46) proposed hashicorp/aws
    # 6.72.0, ten days old.
    cooldown: {default-days: 14}
    # One PR for all fourteen directories. Without it every provider bump is
    # seven PRs, each with its own apply, that only make sense together.
    groups:
      terraform: {patterns: ["*"]}
    commit-message:
      prefix: "deps"
