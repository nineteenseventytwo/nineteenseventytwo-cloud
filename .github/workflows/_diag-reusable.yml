---
name: diag-reusable

on:
  workflow_call:
    inputs:
      stack:
        required: true
        type: string
      mode:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - run: echo "reached the job"
